# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    logos_directory: '%kernel.project_dir%/public/uploads/logos'
    banners_directory: '%kernel.project_dir%/public/uploads/banners'
    profilePicture_directory: '%kernel.project_dir%/public/uploads/profilePicture'
    invoice_directory: '%kernel.project_dir%/public/uploads/invoices'
    devis_directory: '%kernel.project_dir%/public/uploads/devis'
    pictures_directory: '%kernel.project_dir%/public/uploads/profilePicture'





services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            # - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\AI\GroqService:
        arguments:
            $httpClient: '@http_client'
            $apiKey: '%env(GROQ_API_KEY)%'
            $tools:
                ListOrganizationsTool: '@App\Service\AI\Tools\ListOrganizationsTool'
                GetInvoiceStatsTool: '@App\Service\AI\Tools\GetInvoiceStatsTool'
                CalculateTaxesTool: '@App\Service\AI\Tools\CalculateTaxesTool'
                GetQuoteStatsTool: '@App\Service\AI\Tools\GetQuoteStatsTool'
                ListQuotesTool: '@App\Service\AI\Tools\ListQuotesTool'
                QuoteFollowUpTool: '@App\Service\AI\Tools\QuoteFollowUpTool'

    App\Service\AI\Tools\ListOrganizationsTool:
        autowire: true
        
    App\Service\AI\Tools\GetInvoiceStatsTool:
        autowire: true
        
    App\Service\AI\Tools\CalculateTaxesTool:
        autowire: true

    App\Service\AI\Tools\GetQuoteStatsTool:
        autowire: true
        
    App\Service\AI\Tools\ListQuotesTool:
        autowire: true
        
    App\Service\AI\Tools\QuoteFollowUpTool:
        autowire: true
